<head>
    <title>Panel de Admin - Cargar Producto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <div class="contenedor">

        {% extends 'base.html' %}
        {% block content %}

        <div class="todo-centrado">

        <h2>Cargar Nuevo Producto</h2>
        <form method="POST" enctype="multipart/form-data">
            <label>Nombre del Producto:</label><br>
            <input type="text" name="nombre" required><br><br>

            <label>Precio:</label><br>
            <input type="number" step="0.01" name="precio" required><br><br>

            <label>Categoría:</label><br>
            <select name="categoria">
                <option value="" disabled selected>-- Seleccione una categoría --</option>
    
                {# Recorremos las categorías dinámicas de la base de datos #}
                {% for cat in categorias %}
                    <option value="{{ cat }}">{{ cat }}</option>
                {% endfor %}
            </select>
            <br><br>

            <div style="border-top: 1px dashed #ccc; padding-top: 15px; margin-top: 10px;">
                <p style="margin: 0 0 10px 0; font-size: 0.9em; color: #555;">
                    <i>¿La categoría que buscás no está en la lista? Creala acá:</i>
                </p>
                <label>Nueva Categoría (Opcional):</label><br>
                <input type="text" name="nueva_categoria" placeholder="Ej: Conservadoras" style="padding: 5px; width: 200px; border-radius: 4px; border: 1px solid #ccc;">
            </div>

            <label>Imagen del Producto:</label><br>
            <input type="file" name="imagen" accept="image/*" required><br><br>

            <label>Stock:</label><br>
            <input type="number" name="stock" min="0"><br><br>

            <label>Descripción:</label><br>
            <textarea name="descripcion"></textarea><br><br>

            <button type="submit" class="btn-pagar">Guardar Producto</button>
        </form>
        <br>
        <a href="/">Volver al inicio</a> 

        </div>
    {% endblock %}
    </div>
</body>
</html>
