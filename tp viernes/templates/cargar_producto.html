{% extends 'base.html' %}
{% block content %}
<div class="contenedor">
    <br><br>
    <div class="todo-centrado">
        <div class="tarjeta-formulario">
            
            <i class="fa-solid fa-box-open fa-3x" style="color: #13283A; margin-bottom: 10px;"></i>
            <h2>Cargar Producto</h2>
            <p class="subtitulo-form">Carga de nuevos artículos al catálogo general</p>

            <form method="POST" enctype="multipart/form-data">
                <label>Nombre del Producto:</label>
                <input type="text" name="nombre" placeholder="Ej. Mate Camionero" required>

                <label>Precio:</label>
                <input type="number" step="0.01" name="precio" placeholder="0.00" required>

                <label>Categoría:</label>
                <select name="categoria">
                    <option value="Mates">Mates</option>
                    <option value="Termos">Termos</option>
                    <option value="Yerbas">Yerbas</option>
                    <option value="Bombillas">Bombillas</option>
                </select>

                <label>Imagen del Producto:</label>
                <input type="file" name="imagen" accept="image/*" required>

                <label>Stock Inicial:</label>
                <input type="number" name="stock" min="0" placeholder="Cantidad de unidades">

                <label>Descripción:</label>
                <textarea name="descripcion" placeholder="Detalles del producto..."></textarea>

                <button type="submit" class="btn-formulario">Guardar Producto</button>
            </form>
            
            <br>
            <a href="{{ url_for('lista_productos') }}" style="text-decoration: none; color: #13283A; font-weight: bold;">
                <i class="fa-solid fa-arrow-left"></i> Volver al Inventario
            </a> 
        </div>
    </div>
</div>
{% endblock %}
