<head>
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/logo_fondof.png') }}">
    <title>Mate Argento - Editar Producto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="{% block body_class %}fondo-mujer{% endblock %}">
    <div class="todo-centrado">
        <div class="tarjeta" style="
            width: 420px; 
            height: 750px;
            background-color: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            border-radius: 15px;">
            <a href="/">
                <img src="{{ url_for('static', filename='img/logo_fondof.png') }}" style="width: 120px; height: 120px;">
            </a>
    
            <h2>Editar Producto</h2>
            <p class="subtitulo-form">Modificando los datos de: <strong>{{ producto.nombre }}</strong></p>

            <form method="POST" enctype="multipart/form-data">
                <label>Nombre del Producto:</label>
                <input type="text" name="nombre" value="{{ producto.nombre }}" required>
                <br><br>
                <label>Precio Venta ($):</label>
                <input type="number" step="0.01" name="precio" value="{{ producto.precio| dinero }}" required>
                <br><br>
                <label>Precio Costo ($):</label>
                <input type="number" step="0.01" name="precio_costo" value="{{ producto.precio_costo if producto.precio_costo else 0.0 }}" required>
                <br><br>
                <p style="color: #666; font-size: 0.75em; margin: -5px 0 10px 0; text-align: left; font-style: italic;">
                    (Valor de compra al proveedor para calcular márgenes de ganancia)
                </p>

                <select name="categoria">
                    {% for cat in todas_las_categorias %}
                        <option value="{{ cat.nombre }}" 
                            {% if producto and producto.categoria == cat.nombre %}selected{% endif %}>
                            {{ cat.nombre }}
                        </option>
                    {% endfor %}
                </select>

                <label>Imagen del Producto:</label>
                <div style="background: white; padding: 10px; display: flex; align-items: center; border-radius: 5px; border: 1px solid #ccc; margin-bottom: 10px;">
                    <img src="{{ url_for('static', filename='img/' + producto.imagen) }}" class="admin-tabla-img" style="margin-right: 15px;">
                    <div style="text-align: left;">
                        <span style="color: #13283A; font-size: 0.85em; display: block; font-weight: bold;">Foto actual:</span>
                        <span style="color: #555; font-size: 0.8em; word-break: break-all;">{{ producto.imagen }}</span>
                    </div>
                </div>
                
                <p style="color: #555; font-size: 0.75em; margin: -5px 0 10px 0; text-align: left; font-style: italic;">
                    (Seleccioná un archivo nuevo solo si deseás reemplazar la foto actual)
                </p>
                <input type="file" name="imagen" accept="image/*">

                <label>Stock Disponible:</label>
                <input type="number" name="stock" min="0" value="{{ producto.stock }}">

                <label>Descripción:</label>
                <textarea name="descripcion" placeholder="Detalles del producto...">{{ producto.descripcion }}</textarea>
                <br><br>
                <button type="submit" class="btn-formulario">Aplicar Modificaciones</button>
            </form>
            
            <br>
            <a href="{{ url_for('lista_productos') }}" style="text-decoration: none; color: #13283A; font-weight: bold;">
                <i class="fa-solid fa-arrow-left"></i> Cancelar y volver
            </a> 
        </div>
    </div>
</body>
</html>
