<head>
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/logo_fondof.png') }}">
    <title>Mate Argento - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="{% block body_class %}fondo-mujer{% endblock %}">
    <!-- NOTIFICACIONES FLASH -->
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="mensaje-push" id="notificacion">
                {{ messages[0] }}
            </div>
            <script>
                setTimeout(() => {
                    const notify = document.getElementById('notificacion');
                    if(notify) {
                        notify.style.opacity = '0';
                        setTimeout(() => notify.remove(), 500);
                    }
                }, 3000);
            </script>
        {% endif %}
    {% endwith %}
    <div class="todo-centrado">
        <div class="tarjeta" style="
            background-color: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            width: 420px; 
            height: 500px;
            border-radius: 15px;">
            <a href="/">
                <img src="{{ url_for('static', filename='img/logo_fondof.png') }}" style="width: 120px; height: 120px;">
            </a>

            <h2>Registrarse</h2>
    
            <form action="/registrar_usuario" method="POST">
                <label>Nombre:</label><br>
                <input type="text" name="nombre" placeholder="Tu nombre" required>
                <br><br>

                <label>Email:</label><br>
                <input type="email" name="email" placeholder="mail@ejemplo.com" required>
                <br><br>

                <label>Contraseña:</label><br>
                <input type="password" name="password" placeholder="Contraseña..." required>
                <br><br>

                <button type="submit">Crear cuenta</button>
            </form>
            <br>
            <p>¿Ya tenés cuenta? <a href="/login">Iniciá sesión acá</a></p>
            <br>
        </div>
    </div>
</body>
