<head>
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/logo_fondof.png') }}">
    <title>Mate Argento - Reseteo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="{% block body_class %}fondo-mujer{% endblock %}">
<div class="todo-centrado">
    <div class="tarjeta" style="
        background-color: rgba(255, 255, 255, 0.2); 
        backdrop-filter: blur(15px); 
        -webkit-backdrop-filter: blur(15px); 
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        width: 420px; 
        height: 400px;
        border-radius: 15px;">
        <a href="/">
            <img src="{{ url_for('static', filename='img/logo_fondof.png') }}" style="width: 120px; height: 120px;">
        </a>
        <form action="/resetear-password/{{ token }}" method="POST">
            <h2>Nueva Contraseña</h2>
            <p>Escribe tu nueva contraseña a continuación:</p>
    
            <input type="password" name="password" placeholder="Nueva contraseña" required>
    
            <button type="submit">Guardar cambios</button>
        </form>
    </div>
</div>
</body>
